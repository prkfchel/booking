services:
  booking:
      build:
        context: ${PROJECT_ROOT}
        dockerfile: ${PROJECT_ROOT}/cmd/booking/Dockerfile
      container_name: booking
      environment:
        - HTTP_ADDR=:5050
        - HTTP_SHUTDOWN_TIMEOUT=${HTTP_SHUTDOWN_TIMEOUT}
        - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
        - POSTGRES_HOST=booking-postgres
        - POSTGRES_USER=${POSTGRES_USER}
        - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
        - POSTGRES_DB=${POSTGRES_DB}
        - POSTGRES_TIMEOUT=${POSTGRES_TIMEOUT}
        - LOGGER_LEVEL=${LOGGER_LEVEL}
        - TIME_ZONE=${TIME_ZONE}
        - LOGGER_FOLDER=/app/out/logs
      volumes:
        - ${PROJECT_ROOT}/out/logs:/app/out/logs
      ports:
        - "5050:5050"
      restart: always

  booking-postgres:
    image: postgres:18.3-bookworm
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/.pgdata:/var/lib/postgresql

  booking-migrate-postgres:
    image: migrate/migrate:v4.17.0
    volumes: 
    - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: booking-env-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:booking-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"