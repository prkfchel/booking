services:
  booking-postgres:
    image: postgres:18.3-bookworm
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/.pgdata:/var/lib/postgresql

  booking-migrate-postgres:
    image: migrate/migrate:v4.17.0
    volumes: 
    - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.0.3
    container_name: booking-env-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:booking-postgres:5432
    ports:
      - "127.0.0.1:5432:5432"