host: 127.0.0.1:5050
info:
  contact: {}
  description: Booking App REST-API scheme
  title: Booking API
  version: "1.0"
paths:
  /books:
    get:
      description: Просмотр списка броней с опциональной пагинацией и фильтрацией
        по пользователю и событию и времяни создания
      parameters:
      - description: Размер страницы с бронями
        in: query
        name: limit
        type: integer
      - description: Смещение страницы с бронями
        in: query
        name: offset
        type: integer
      - description: Конец временного интервала
        in: query
        name: dateTo
        type: integer
      - description: ID владельца брони
        in: query
        name: userId
        type: integer
      - description: ID события
        in: query
        name: eventId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешное получение списка броней
          schema:
            items:
              $ref: '#/definitions/internal_features_bookings_transport_http.BookResponseDTO'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
      summary: Список броней
      tags:
      - bookings
    post:
      consumes:
      - application/json
      description: Создать новую бронь в системе
      parameters:
      - description: CreateEvent тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_bookings_transport_http.createBookRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Успешно созданная бронь
          schema:
            $ref: '#/definitions/internal_features_bookings_transport_http.createBookResponseDTO'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
      summary: Создать бронь
      tags:
      - bookings
  /books/{id}:
    get:
      description: Получение конкретной брони по ее ID
      parameters:
      - description: ID получаемой брони
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Бронь успешно найдена
          schema:
            $ref: '#/definitions/internal_features_bookings_transport_http.getBookResponseDTO'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Event not found
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
      summary: Получение брони
      tags:
      - bookings
  /books/cancel:
    post:
      description: Отменить бронь в системе
      parameters:
      - description: ID отменяемой брони
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Бронь успешно отменена
          schema:
            $ref: '#/definitions/internal_features_bookings_transport_http.cancelBookResponseDTO'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
      summary: Отменить бронь
      tags:
      - bookings
  /event/{id}:
    patch:
      consumes:
      - application/json
      description: |-
        Изменение информации об уже существующем в системе событии
        ### Логика обновления полей (Three-state logic):
        1. **Поле не передано**: `description` игнорируется, значение в БД не меняется
        2. **Явно передано значение**: `"description": "событие бла-бла-бла"` - устанавливает новое описание в БД
        3. **Передан null**: `"description": null` - очищает поле в БД (set to NULL)
        Ограничения: `title` не может быть выставлен как null
        Ограничения: `total_tickets` не может быть выставлен как null
        Ограничения: `address` не может быть выставлен как null
        Ограничения: `starts_at` не может быть выставлен как null
      parameters:
      - description: ID изменяемого события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: PatchEvent тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_events_transport_http.patchEventRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Успешно изменённый пользователь
          schema:
            $ref: '#/definitions/internal_features_events_transport_http.patchEventResponseDTO'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: event not found
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
      summary: Изменение события
      tags:
      - events
  /events:
    get:
      consumes:
      - application/json
      description: Просмотр списка событий с опциональной пагинацией и фильтрацией
        по названию и аддресу, времяни проведениря и id организатора
      parameters:
      - description: Размер страницы с событиями
        in: query
        name: limit
        type: integer
      - description: Смещение страницы с событиями
        in: query
        name: offset
        type: integer
      - description: Конец временного интервала
        in: query
        name: dateTo
        type: integer
      - description: ID организатора мероприятия
        in: query
        name: ownerId
        type: integer
      - description: GetEvents тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_events_transport_http.getEventsRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: Успешное получение списка событий
          schema:
            items:
              $ref: '#/definitions/internal_features_events_transport_http.EventResponseDTO'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
      summary: Список событий
      tags:
      - events
    post:
      consumes:
      - application/json
      description: Создать новое событие в системе
      parameters:
      - description: CreateEvent тело запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_events_transport_http.createEventRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Успешно созданное событие
          schema:
            $ref: '#/definitions/internal_features_events_transport_http.createEventResponseDTO'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
      summary: Создать событие
      tags:
      - events
  /events/{id}:
    get:
      description: Получение конкретного события по его ID
      parameters:
      - description: ID получаемого события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: событие успешно найдено
          schema:
            $ref: '#/definitions/internal_features_events_transport_http.getEventReaponseDTO'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Event not found
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
      summary: Получение события
      tags:
      - events
  /events/cancel:
    post:
      description: Отменить событие в системе
      parameters:
      - description: ID отменяемого события
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Событие успешно отменено
          schema:
            $ref: '#/definitions/internal_features_events_transport_http.cancelEventResponseDTO'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/booking_internal_core_transport_http_response.ErrorResponse'
      summary: Отменить событие
      tags:
      - events
  /users:
    get:
      description: Просмотр списка пользователей с опциональной пагинацией
      parameters:
      - description: Размер страницы с пользователями
        in: query
        name: limit
